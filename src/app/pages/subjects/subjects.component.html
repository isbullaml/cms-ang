<!-- Page Header -->
<div class="mb-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">Subjects</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manage subjects and curriculum offerings.</p>
    </div>
    <button class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-brand-600 transition-colors">
      <i class="pi pi-plus text-sm"></i>
      Add Subject
    </button>
  </div>
</div>

<!-- Stats -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
  <div class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-gray-900">
    <div class="flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-full bg-brand-50 dark:bg-brand-500/10">
        <i class="pi pi-book text-xl text-brand-500"></i>
      </div>
      <div>
        <p class="text-2xl font-semibold text-gray-900 dark:text-white">{{ subjects.length }}</p>
        <p class="text-xs text-gray-500 dark:text-gray-400">Total Subjects</p>
      </div>
    </div>
  </div>
  <div class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-gray-900">
    <div class="flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-full bg-success-50 dark:bg-success-500/10">
        <i class="pi pi-users text-xl text-success-500"></i>
      </div>
      <div>
        <p class="text-2xl font-semibold text-gray-900 dark:text-white">8</p>
        <p class="text-xs text-gray-500 dark:text-gray-400">Active Tutors</p>
      </div>
    </div>
  </div>
  <div class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-gray-900">
    <div class="flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-full bg-warning-50 dark:bg-warning-500/10">
        <i class="pi pi-graduation-cap text-xl text-warning-500"></i>
      </div>
      <div>
        <p class="text-2xl font-semibold text-gray-900 dark:text-white">14</p>
        <p class="text-xs text-gray-500 dark:text-gray-400">Enrollments</p>
      </div>
    </div>
  </div>
</div>

<!-- Subject Cards Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
  @for (subject of subjects; track subject.id) {
    <div class="rounded-xl border border-gray-200 bg-white p-5 hover:shadow-theme-md hover:border-brand-200 transition-all cursor-pointer dark:border-gray-800 dark:bg-gray-900 dark:hover:border-brand-500/30">
      <div class="flex items-start gap-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-xl {{ subject.color }} shrink-0">
          <i class="pi {{ subject.icon }} text-xl"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="font-semibold text-gray-900 dark:text-white">{{ subject.name }}</h3>
          <div class="flex items-center gap-3 mt-2 text-sm text-gray-500 dark:text-gray-400">
            <span class="inline-flex items-center gap-1">
              <i class="pi pi-user text-xs"></i>
              {{ subject.tutors }} tutors
            </span>
            <span class="inline-flex items-center gap-1">
              <i class="pi pi-graduation-cap text-xs"></i>
              {{ subject.students }} students
            </span>
          </div>
        </div>
        <button class="rounded-lg p-2 text-gray-400 hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-gray-800 dark:hover:text-gray-300 transition-colors">
          <i class="pi pi-ellipsis-v text-sm"></i>
        </button>
      </div>
    </div>
  }
</div>
